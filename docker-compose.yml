name: careconnect
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: careconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careconnect"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      CARECONNECT_MONGO_DB: careconnect
    volumes: ["./mongo:/scripts:ro"]
    entrypoint: ["sh", "-c"]
    command: ["mongosh mongodb://mongo:27017/ /scripts/01_collections_and_indexes.js"]
  seed:
    build:
      # Built from the repository root so the image can include sql/ and data_generation/.
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
    environment: &api_environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/careconnect
      CARECONNECT_MONGO_URI: mongodb://mongo:27017/
      CARECONNECT_MONGO_DB: careconnect
      CARECONNECT_DEMO_MODE: "true"
      CARECONNECT_COOKIE_SECURE: "false"
      CARECONNECT_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    command: ["python", "scripts/bootstrap.py"]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      seed: {condition: service_completed_successfully}
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ./web
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:8080:80"]
volumes:
  postgres_data:
  mongo_data:
