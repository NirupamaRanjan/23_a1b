# Example production reverse-proxy headers. Apply to the real TLS/proxy deployment.
# Emotion/MUI use inline styles; this policy does not permit inline JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self)" always;
# Serve only via HTTPS and add HSTS once HTTPS is configured correctly.
# Proxy /api to your FastAPI service; do not proxy arbitrary user-supplied targets.
