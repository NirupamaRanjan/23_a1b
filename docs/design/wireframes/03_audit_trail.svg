<text x="1274" y="137" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Date filter</text>
<text x="1274" y="158" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Starts on the last 30 UTC days; applied ranges are</text>
<text x="1274" y="176" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">kept per patient when you navigate or reload.</text>
