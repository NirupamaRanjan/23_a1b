<text x="1274" y="234" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Opening balance and count follow the period;</text>
<text x="1274" y="252" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">current balance is always the latest.</text>
