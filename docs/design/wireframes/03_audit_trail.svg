<text x="1274" y="289" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Newest first ledger</text>
<text x="1274" y="310" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Append-only wallet_audit_logs with the running</text>
<text x="1274" y="328" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">balance stored on each row.</text>
<circle cx="1252" cy="360" r="12" fill="#117C76"/>
<text x="1252" y="365" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="1274" y="365" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Older data</text>
<text x="1274" y="386" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">If the last 30 days are empty, opens on the 30 days</text>
<text x="1274" y="404" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">up to the patient&#x27;s latest entry, with a note.</text>
