<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, Arial, sans-serif" role="img" aria-label="CareConnect wireframe - Book an appointment">
<title>CareConnect wireframe - Book an appointment</title>
<rect width="1600" height="1000" fill="#f7f7f7"/>
<rect x="20" y="20" width="1180" height="960" rx="12" fill="#ffffff" stroke="#7a7a7a" stroke-width="2"/>
<path d="M48 62c0-10 12-14 18-6 6-8 18-4 18 6 0 10-18 20-18 20s-18-10-18-20z" fill="#117C76"/>
<text x="96" y="74" font-size="22" font-weight="bold" fill="#2b2b2b" text-anchor="start">CareConnect</text>
<text x="640" y="52" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Acting as (demo)</text>
<rect x="640" y="58" width="250" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="650" y="80" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start">Patient: &lt;name&gt;  ▾</text>
<text x="910" y="52" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Selected clinic</text>
<rect x="910" y="58" width="260" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="920" y="80" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start">&lt;clinic name&gt; (id)  ▾</text>
<line x1="20" y1="112" x2="1200" y2="112" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="44" y="146" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Browse</text>
<text x="140" y="146" font-size="14" font-weight="bold" fill="#117C76" text-anchor="start">Transaction</text>
<line x1="134" y1="164" x2="242" y2="164" stroke="#117C76" stroke-width="3"/>
<text x="276" y="146" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Audit trail</text>
<text x="412" y="146" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Analytics</text>
<text x="532" y="146" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Map</text>
<text x="604" y="146" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Reviews</text>
<line x1="20" y1="166" x2="1200" y2="166" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="44" y="214" font-size="28" font-weight="bold" fill="#2b2b2b" text-anchor="start">Book an appointment</text>
<text x="44" y="240" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Confirm your clinic and copay. Your HSA charge and audit entry are saved together.</text>
<text x="44" y="966" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Footer: Amounts use HSA account units. Dates and times are shown in UTC.</text>
<text x="1240" y="60" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="start">Book an appointment</text>
<text x="1240" y="84" font-size="13" font-weight="normal" fill="#6b6b6b" text-anchor="start">Interactions and states</text>
<line x1="1240" y1="98" x2="1570" y2="98" stroke="#9a9a9a" stroke-width="1.5"/>
<rect x="44" y="266" width="520" height="560" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="68" y="300" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="start">Booking details</text>
<text x="68" y="330" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Patient</text>
<rect x="68" y="336" width="472" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="78" y="358" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start">&lt;patient from session&gt; (read-only)</text>
<text x="540" y="394" font-size="12" font-weight="bold" fill="#117C76" text-anchor="end">Change in Browse</text>
<text x="68" y="414" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Clinic</text>
<rect x="68" y="420" width="472" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="78" y="442" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start">&lt;clinic name&gt; · id (read-only)</text>
<rect x="68" y="474" width="472" height="90" rx="8" fill="#ececec" stroke="none" stroke-width="1.5"/>
<text x="88" y="504" font-size="13" font-weight="bold" fill="#6b6b6b" text-anchor="start">Current HSA balance</text>
<text x="88" y="544" font-size="30" font-weight="bold" fill="#2b2b2b" text-anchor="start">1,331.43</text>
<text x="68" y="594" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Copay amount</text>
<rect x="68" y="600" width="472" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="78" y="622" font-size="13" font-weight="normal" fill="#2b2b2b" text-anchor="start">250.00</text>
<text x="68" y="652" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Positive amount, up to two decimal places.</text>
<rect x="68" y="672" width="472" height="36" rx="8" fill="#117C76" stroke="#117C76" stroke-width="1.5"/>
<text x="304.0" y="695" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Book appointment</text>
<rect x="68" y="724" width="472" height="40" rx="8" fill="#fbecec" stroke="#d9a3a3" stroke-width="1.5"/>
<text x="84" y="749" font-size="12" font-weight="normal" fill="#8a3b3b" text-anchor="start">! Friendly error, e.g. &quot;Your HSA balance is too low…&quot;</text>
<rect x="588" y="266" width="588" height="400" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="612" y="300" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="start">Result</text>
<rect x="612" y="320" width="540" height="60" rx="8" fill="#e6f2f1" stroke="none" stroke-width="1.5"/>
<text x="632" y="356" font-size="15" font-weight="bold" fill="#117C76" text-anchor="start">✓ Appointment booked · &lt;clinic&gt; · Waiting</text>
<text x="612" y="412" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Appointment ID</text>
<rect x="612" y="422" width="110" height="12" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<text x="792" y="412" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Balance before</text>
<rect x="792" y="422" width="110" height="12" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<text x="972" y="412" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Balance after</text>
<rect x="972" y="422" width="110" height="12" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<text x="612" y="476" font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="start">Audit entry created by the trigger</text>
<rect x="612" y="496" width="399.0" height="10" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<rect x="612" y="522" width="348.59999999999997" height="10" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<rect x="612" y="548" width="298.2" height="10" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<rect x="612" y="574" width="399.0" height="10" rx="4" fill="#ececec" stroke="none" stroke-width="1.5"/>
<rect x="612" y="610" width="160" height="36" rx="8" fill="#ffffff" stroke="#117C76" stroke-width="1.5"/>
<text x="692.0" y="633" font-size="13" font-weight="bold" fill="#117C76" text-anchor="middle">View audit trail →</text>
<rect x="588" y="690" width="588" height="150" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="612" y="720" font-size="14" font-weight="bold" fill="#6b6b6b" text-anchor="start">Clinic staff (alternative state)</text>
<text x="612" y="746" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Whole screen replaced by: &quot;Clinic staff cannot book appointments&quot;</text>
<text x="612" y="766" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">+ explanation and a &quot;Go to Browse&quot; button. No form is shown.</text>
<rect x="612" y="786" width="140" height="36" rx="8" fill="#ffffff" stroke="#117C76" stroke-width="1.5"/>
<text x="682.0" y="809" font-size="13" font-weight="bold" fill="#117C76" text-anchor="middle">Go to Browse</text>
<circle cx="554" cy="618" r="11" fill="#117C76" opacity="0.9"/>
<text x="554" y="622" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="554" cy="690" r="11" fill="#117C76" opacity="0.9"/>
<text x="554" y="694" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="1166" cy="350" r="11" fill="#117C76" opacity="0.9"/>
<text x="1166" y="354" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="1166" cy="706" r="11" fill="#117C76" opacity="0.9"/>
<text x="1166" y="710" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="1252" cy="132" r="12" fill="#117C76"/>
<text x="1252" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="1274" y="137" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Copay validation</text>
<text x="1274" y="158" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Positive, at most two decimals; checked in the</text>
<text x="1274" y="176" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">browser and again by the API.</text>
<circle cx="1252" cy="208" r="12" fill="#117C76"/>
<text x="1252" y="213" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="1274" y="213" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">One click, one booking</text>
<text x="1274" y="234" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Calls sp_execute_appointment in one transaction;</text>
<text x="1274" y="252" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">an idempotency key makes retries safe.</text>
<circle cx="1252" cy="284" r="12" fill="#117C76"/>
<text x="1252" y="289" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="1274" y="289" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Result from the database</text>
<text x="1274" y="310" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Shows balance before/after and the exact audit</text>
<text x="1274" y="328" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">row written by the trigger.</text>
<circle cx="1252" cy="360" r="12" fill="#117C76"/>
<text x="1252" y="365" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="1274" y="365" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Patients only</text>
<text x="1274" y="386" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Clinic staff see an access message instead of</text>
<text x="1274" y="404" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">the form (API also answers PATIENT_ONLY).</text>
<circle cx="1252" cy="436" r="12" fill="#117C76"/>
<text x="1252" y="441" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="1274" y="441" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Friendly failures</text>
<text x="1274" y="462" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Insufficient balance, active visit already open,</text>
<text x="1274" y="480" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">clinic not accepting, API unreachable.</text>
</svg>
