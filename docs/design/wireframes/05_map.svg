<text x="1037.0" y="313" font-size="13" font-weight="bold" fill="#117C76" text-anchor="middle">⟳ Refresh now</text>
<text x="68" y="346" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Using your current location (accuracy 30 m). Needs browser permission and HTTPS or localhost.</text>
<rect x="44" y="382" width="700" height="484" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="68" y="416" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="start">5 km search radius</text>
<rect x="68" y="432" width="652" height="410" rx="8" fill="#eef0ee" stroke="none" stroke-width="1.5"/>
<text x="394" y="452" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="middle">OpenStreetMap tiles (Leaflet)</text>
<circle cx="394" cy="637" r="150" fill="#117C76" fill-opacity="0.08" stroke="#117C76" stroke-width="2"/>
<circle cx="394" cy="637" r="7" fill="#117C76"/>
<circle cx="360" cy="600" r="6" fill="#4c9a54" stroke="#ffffff" stroke-width="2"/>
