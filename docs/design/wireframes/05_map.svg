<text x="44" y="214" font-size="28" font-weight="bold" fill="#2b2b2b" text-anchor="start">Nearby nurses</text>
<text x="44" y="240" font-size="14" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active nurses within 5 km of your current or chosen location. Results update every 10 seconds.</text>
<text x="44" y="966" font-size="11" font-weight="normal" fill="#6b6b6b" text-anchor="start">Footer: Amounts use HSA account units. Dates and times are shown in UTC.</text>
<text x="1240" y="60" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="start">Nearby nurses</text>
<text x="1240" y="84" font-size="13" font-weight="normal" fill="#6b6b6b" text-anchor="start">Interactions and states</text>
