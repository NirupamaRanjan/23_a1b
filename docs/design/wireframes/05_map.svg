<text x="788" y="416" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="start">Distance-ordered results</text>
<text x="788" y="440" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Updated &lt;time&gt; UTC</text>
