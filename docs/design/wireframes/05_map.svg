<circle cx="1110" cy="280" r="11" fill="#117C76" opacity="0.9"/>
<text x="1110" y="284" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="734" cy="470" r="11" fill="#117C76" opacity="0.9"/>
<text x="734" y="474" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="1166" cy="470" r="11" fill="#117C76" opacity="0.9"/>
<text x="1166" y="474" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="1252" cy="132" r="12" fill="#117C76"/>
<text x="1252" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="1274" y="137" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Choosing the origin</text>
<text x="1274" y="158" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Browser location on entry; or type coordinates,</text>
<text x="1274" y="176" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">click the map, or use the selected clinic.</text>
<circle cx="1252" cy="208" r="12" fill="#117C76"/>
<text x="1252" y="213" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="1274" y="213" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Fixed 5 km $geoNear</text>
<text x="1274" y="234" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Circle shows the radius; clicking a marker</text>
<text x="1274" y="252" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">highlights its row without moving the origin.</text>
<circle cx="1252" cy="284" r="12" fill="#117C76"/>
<text x="1252" y="289" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="1274" y="289" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Latest active ping only</text>
<text x="1274" y="310" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Each nurse&#x27;s newest ping within 2 hours, if</text>
<text x="1274" y="328" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">active and inside 5 km; sorted by distance.</text>
<circle cx="1252" cy="360" r="12" fill="#117C76"/>
<text x="1252" y="365" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="1274" y="365" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Live updates</text>
<text x="1274" y="386" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Polls every 10 s while visible; a failed refresh</text>
<text x="1274" y="404" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">keeps the last results, marked as stale.</text>
<circle cx="1252" cy="436" r="12" fill="#117C76"/>
<text x="1252" y="441" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="1274" y="441" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Location states</text>
<text x="1274" y="462" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Permission denied, timeout or unsupported</text>
<text x="1274" y="480" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">location each explain the manual alternatives.</text>
