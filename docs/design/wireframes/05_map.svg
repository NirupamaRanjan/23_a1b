<text x="788" y="688" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active · ping &lt;time&gt; UTC</text>
<line x1="788" y1="700" x2="1152" y2="700" stroke="#d6d6d6" stroke-width="1"/>
<text x="788" y="730" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">5. &lt;nurse name&gt;</text>
<text x="1150" y="730" font-size="14" font-weight="bold" fill="#117C76" text-anchor="end">0.60 km</text>
<text x="788" y="750" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active · ping &lt;time&gt; UTC</text>
<line x1="788" y1="762" x2="1152" y2="762" stroke="#d6d6d6" stroke-width="1"/>
