<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, Arial, sans-serif" role="img" aria-label="CareConnect wireframe - Nearby nurses">
<title>CareConnect wireframe - Nearby nurses</title>
<rect width="1600" height="1000" fill="#f7f7f7"/>
<rect x="20" y="20" width="1180" height="960" rx="12" fill="#ffffff" stroke="#7a7a7a" stroke-width="2"/>
