<text x="1150" y="544" font-size="14" font-weight="bold" fill="#117C76" text-anchor="end">0.30 km</text>
<text x="788" y="564" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active · ping &lt;time&gt; UTC</text>
<line x1="788" y1="576" x2="1152" y2="576" stroke="#d6d6d6" stroke-width="1"/>
<text x="788" y="606" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">3. &lt;nurse name&gt;</text>
<text x="1150" y="606" font-size="14" font-weight="bold" fill="#117C76" text-anchor="end">0.40 km</text>
<text x="788" y="626" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active · ping &lt;time&gt; UTC</text>
<line x1="788" y1="638" x2="1152" y2="638" stroke="#d6d6d6" stroke-width="1"/>
<text x="788" y="668" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">4. &lt;nurse name&gt;</text>
