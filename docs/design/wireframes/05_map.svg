<text x="1150" y="792" font-size="14" font-weight="bold" fill="#117C76" text-anchor="end">0.70 km</text>
<text x="788" y="812" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Active · ping &lt;time&gt; UTC</text>
