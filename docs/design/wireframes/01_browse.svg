<text x="1146" y="622" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="1146" cy="708" r="11" fill="#117C76" opacity="0.9"/>
<text x="1146" y="712" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="1252" cy="132" r="12" fill="#117C76"/>
<text x="1252" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="1274" y="137" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Server-side search and filter</text>
<text x="1274" y="158" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Literal search (max 120 chars); clinics filter</text>
<text x="1274" y="176" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">by accepting / not accepting. Paged 5 per page.</text>
<circle cx="1252" cy="208" r="12" fill="#117C76"/>
<text x="1252" y="213" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="1274" y="213" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Row opens details inline</text>
<text x="1274" y="234" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">No separate detail page; selected row is</text>
<text x="1274" y="252" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">highlighted and the panel loads its record.</text>
<circle cx="1252" cy="284" r="12" fill="#117C76"/>
<text x="1252" y="289" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="1274" y="289" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Book at this clinic</text>
<text x="1274" y="310" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Carries the clinic into Transaction.</text>
<text x="1274" y="328" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">It never books by itself.</text>
<circle cx="1252" cy="360" r="12" fill="#117C76"/>
<text x="1252" y="365" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="1274" y="365" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Status buttons (staff only)</text>
<text x="1274" y="386" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">WAITING → IN_CONSULTATION → DISCHARGED,</text>
<text x="1274" y="404" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">only for the staff member&#x27;s own clinic.</text>
<circle cx="1252" cy="436" r="12" fill="#117C76"/>
<text x="1252" y="441" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="1274" y="441" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">Patient view</text>
<text x="1274" y="462" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Patients tab shows only their own record and</text>
<text x="1274" y="480" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">no search box; appointments are their own.</text>
<circle cx="1252" cy="512" r="12" fill="#117C76"/>
<text x="1252" y="517" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="1274" y="517" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="start">States</text>
<text x="1274" y="538" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">Loading bar, error with Retry, and an empty</text>
<text x="1274" y="556" font-size="12" font-weight="normal" fill="#6b6b6b" text-anchor="start">state with &quot;Clear filters&quot; when nothing matches.</text>
</svg>
