<text x="548" y="360" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="742" cy="420" r="11" fill="#117C76" opacity="0.9"/>
<text x="742" y="424" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
